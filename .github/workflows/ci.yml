name: CI (테스트 · 빌드 · 린트)

# 지금까지 CI에는 보안 스캔만 있어서 테스트가 깨진 변경도 그대로 main에 올라갈 수
# 있었다. 프런트와 백엔드의 테스트를 병합 게이트로 둔다.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# 같은 브랜치에서 새 푸시가 오면 진행 중이던 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 러너 기본값은 UTC라 날짜와 시각을 다루는 테스트가 개발자 기기(KST)와 다른 결과를
# 낸다. 정왕 지역 교통 정보를 다루는 서비스라 KST가 실제 동작 기준이므로 러너 시간대를
# 서울로 고정한다.
env:
  TZ: Asia/Seoul

jobs:
  frontend:
    name: 프런트엔드 (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # eslint 10이 Node 20.19+ 또는 22.13+ 를 요구한다.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 테스트
        run: npm test

      - name: 빌드
        run: npm run build

      - name: 린트
        run: npm run lint

  backend:
    name: 백엔드 (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 외부 API와 DB는 테스트에서 모킹하므로 서비스 컨테이너는 필요 없다. 다만
      # Settings(pydantic)가 기본값 없는 필드를 요구해 import 단계에서 실패하므로,
      # 실제로 접속하지 않는 자리표시자를 넣어 설정 검증만 통과시킨다.
      - name: 테스트
        env:
          DB_HOST: localhost
          DB_NAME: test
          DB_USER: test
          DB_PASSWORD: test
          REDIS_HOST: localhost
          ADMIN_USERNAME: test
          ADMIN_PASSWORD_HASH: test
          JWT_SECRET_KEY: test-only-not-a-real-secret
          ALLOWED_ORIGINS: http://localhost:5173
        run: pytest -q
