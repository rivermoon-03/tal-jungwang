name: CI (테스트 · 빌드 · 린트)

# 지금까지 CI에는 보안 스캔만 있어서 테스트가 깨진 변경도 그대로 main에 올라갈 수
# 있었다. 프런트와 백엔드의 테스트를 병합 게이트로 둔다.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# 같은 브랜치에서 새 푸시가 오면 진행 중이던 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 프런트엔드 (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # eslint 10이 Node 20.19+ 또는 22.13+ 를 요구한다.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 테스트
        run: npm test

      - name: 빌드
        run: npm run build

      # 린트는 아직 남은 지적이 있어 병합을 막지 않는다. 수치가 줄어드는지 로그로
      # 확인하는 용도이며, 0이 되면 continue-on-error를 떼고 게이트로 승격한다.
      - name: 린트 (참고용, 실패해도 계속)
        run: npm run lint
        continue-on-error: true

  backend:
    name: 백엔드 (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 외부 API와 DB는 테스트에서 모킹하므로 서비스 컨테이너가 필요 없다.
      - name: 테스트
        run: pytest -q
