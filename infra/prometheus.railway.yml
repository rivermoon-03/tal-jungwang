# Railway 배포용 scrape 설정. 로컬 개발은 prometheus.yml 을 쓴다.
#
# 사설망(tal-jungwang.railway.internal)으로 긁는 것이 맞지만 지금은 못 쓴다.
# 사설망은 IPv6 전용인데 백엔드를 "::" 로 묶으면 Railway 공개 프록시가 IPv4 로
# 붙어 못 닿는다(전 사용자 502). 백엔드가 두 스택을 동시에 듣게 만들기 전까지는
# 공개 도메인으로 둔다.
#
# 대신 주기를 60초로 둔다. 15초였을 때 하루 5,760건이 프록시를 거쳐 실사용자
# 요청 통계를 덮고 있었다.
global:
  scrape_interval: 60s

scrape_configs:
  - job_name: fastapi
    metrics_path: /metrics
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["tal-jungwang-production.up.railway.app"]
